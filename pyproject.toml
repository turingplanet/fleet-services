[tool.poetry]
name = "fleet-services"
version = "0.1.0"
description = "Platform-side services: on-demand AI review (RFC 002), registrar (RFC 001 §10)"
authors = ["Turing Planet <walkerhaozheng@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
mcp = "^1.2"
fastapi = "^0.115"     # REST surface at /api (served alongside /mcp when deployed)
uvicorn = "^0.30"      # ASGI server for HTTP/deploy mode
httpx = "^0.27"        # GitHub API calls
pyjwt = {version = "^2.9", extras = ["crypto"]}   # fleet App JWT (RS256)
pyyaml = "^6"          # registry members.yaml parsing
anthropic = "^0.40"    # the platform's reviewer LLM

[tool.poetry.group.dev.dependencies]
pytest = "^8"
ruff = "^0.5"
bandit = "^1.7"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
